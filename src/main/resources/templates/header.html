<!-- header.html -->
<header th:fragment="header">
    <!-- Pasek baneru (nie sticky, przewija się razem ze stroną) -->
    <div class="text-white text-center py-4 mb-2 shadow"
         style="background: linear-gradient(90deg, #0d6efd 40%, #6610f2 100%); position: relative;">
        <span class="d-inline-flex align-items-center justify-content-center">
            <i class="bi bi-chat-dots-fill me-2" style="font-size:2.5rem;"></i>
            <span class="fw-bold display-5" style="letter-spacing:2px; background: linear-gradient(90deg, #fff 60%, #b3c6ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                LEFT or RIGHT
            </span>
        </span>
        <div class="small mt-2 text-white-50 fst-italic">Nowoczesna platforma dyskusyjna</div>
    </div>

    <!-- Sidebar -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="sidebarLabel">Filtry</h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Zamknij"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="list-unstyled">
                <li><input type="checkbox" id="filter1"> <label for="filter1">Opcja 1</label></li>
                <li><input type="checkbox" id="filter2"> <label for="filter2">Opcja 2</label></li>
                <li><input type="checkbox" id="filter3"> <label for="filter3">Opcja 3</label></li>
            </ul>
        </div>
    </div>
</header>
