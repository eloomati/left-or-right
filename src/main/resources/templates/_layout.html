<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="pl">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Moja aplikacja</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

<!-- Nagłówek -->
<div th:replace="~{header :: header}"></div>

<!-- Sidebar -->
<button id="filterButton"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#sidebar"
        aria-controls="sidebar">
    Filtry
</button>
<!-- Sticky navbar -->
<nav id="mainNavbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
    <div class="container-fluid">
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/">Strona główna</a></li>
                <li class="nav-item"><a class="nav-link" href="/proposed">Proponowane</a></li>
                <li class="nav-item" id="watchedTab" th:if="${isLoggedIn}">
                    <a class="nav-link" href="/watched">Obserwowane</a>
                </li>
                <li class="nav-item"><a class="nav-link" href="/about">O nas</a></li>
                <li class="nav-item"><a class="nav-link" href="/contact">Kontakt</a></li>
            </ul>
        </div>
        <form class="d-flex me-2" role="search">
            <input class="form-control me-2" type="search" placeholder="Szukaj..." aria-label="Szukaj">
            <button class="btn btn-outline-light" type="submit">Szukaj</button>
        </form>
        <div>
            <button type="button" class="btn btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#loginModal">
                Zaloguj się
            </button>
            <button type="button" class="btn btn-light" data-bs-toggle="modal" data-bs-target="#registerModal">
                Rejestracja
            </button>
        </div>
    </div>
</nav>

<!-- Główna zawartość -->
<main class="container-fluid py-4">
    <section layout:fragment="content">
        <p>Brak treści</p>
    </section>
</main>

<!-- Stopka -->
<div th:replace="~{footer :: footer}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/custom.js}"></script>


<!-- Rejestracja (fragment Thymeleaf) -->
<div th:replace="~{register-modal :: registerModal}"></div>
<div th:replace="~{login-modal :: loginModal}"></div>

<div th:replace="admin_panel :: #adminPanelModal"></div>
<script src="/js/admin_panel.js"></script>
</body>
</html>
